name: Compilar APK

# Roda sozinho a cada push para o repositório, e também pode ser disparado manualmente
# pela aba "Actions" no GitHub (botão "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Necessário para o job poder publicar uma Release com o APK anexado.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # packages: '' evita o comportamento padrão desta action (que tenta instalar o pacote
      # "tools", removido há tempos do repositório do Android SDK e que causa falha no job).
      # Instalamos manualmente só o que este projeto precisa no passo seguinte.
      - name: Instalar o Android SDK (base)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar os componentes do SDK usados pelo projeto (compileSdk/targetSdk 34)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Compilamos chamando "gradle" diretamente (instalado no passo acima), não "./gradlew" —
      # este projeto não inclui o gradle-wrapper.jar (arquivo binário; não pôde ser baixado no
      # ambiente sem internet onde o projeto foi gerado), então o wrapper não é usado aqui.
      - name: Compilar o APK de debug
        run: gradle assembleDebug --stacktrace

      # Fica disponível na aba "Actions" da execução (exige estar logado no GitHub para baixar).
      - name: Publicar o APK como artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Fica também disponível na aba "Releases" do repositório: link direto, sem precisar estar
      # logado se o repositório for público — o jeito mais fácil de baixar pelo navegador do celular.
      - name: Publicar como Release (mais fácil de baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Detector de Ligações — build #${{ github.run_number }}" \
            --notes "APK de debug gerado automaticamente pelo GitHub Actions a partir do commit ${{ github.sha }}."
